[project]
name = "procfit"
version = "0.1.0"
description = "CLI moderna para consultas do Procfit ERP — conector direto ao SQL Server com exportação streaming"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.1",
    "connectorx>=0.4.5",
    "openpyxl>=3.1.5",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "rich>=13.0.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.26.7",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-mock>=3.15.1",
]
